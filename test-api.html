<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Telegram Bot API Tester</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f4f4f4;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>🤖 Telegram Auth Bot API Tester</h1>
    
    <form id="generateLinkForm">
        <div class="form-group">
            <label for="company_id">Company ID:</label>
            <input type="number" id="company_id" name="company_id" value="123456" required>
        </div>
        
        <div class="form-group">
            <label for="client_id">Client ID:</label>
            <input type="number" id="client_id" name="client_id" value="789012" required>
        </div>
        
        <div class="form-group">
            <label for="phone">Phone:</label>
            <input type="text" id="phone" name="phone" value="79261234567" required>
        </div>
        
        <div class="form-group">
            <label for="client_status">Client Status:</label>
            <select id="client_status" name="client_status" required>
                <option value="new">New (Новый клиент)</option>
                <option value="old">Old (Существующий клиент)</option>
            </select>
        </div>
        
        <button type="submit">Сгенерировать ссылку</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        document.getElementById('generateLinkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Загрузка...';
            resultDiv.className = '';
            
            const data = {
                company_id: parseInt(document.getElementById('company_id').value),
                client_id: parseInt(document.getElementById('client_id').value),
                phone: document.getElementById('phone').value,
                client_status: document.getElementById('client_status').value
            };
            
            try {
                const response = await fetch('http://localhost:3010/api/generate-link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
<strong>✅ Успешно!</strong><br><br>
<strong>Ссылка:</strong><br>
<a href="${result.link}" target="_blank">${result.link}</a><br><br>
<strong>Срок действия:</strong> ${result.expires_in}<br><br>
<strong>Полный ответ:</strong><br>
${JSON.stringify(result, null, 2)}
                    `;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.textContent = '❌ Ошибка:\n' + JSON.stringify(result, null, 2);
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = '❌ Ошибка запроса:\n' + error.message;
            }
        });
    </script>
</body>
</html>
