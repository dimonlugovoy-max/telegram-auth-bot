# docker-compose.prod.yml (продакшн конфигурация)

version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: telegram-auth-bot-prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./bot.db:/app/bot.db
      - ./logs:/app/logs
      - ./backups:/app/backups
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Опциональный Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: telegram-bot-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/ssl/certs
    depends_on:
      - telegram-bot
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge

volumes:
  bot-data:
    driver: local